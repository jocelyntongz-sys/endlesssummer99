<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ending 1</title>
<style>
*{box-sizing:border-box}
html{min-height:100%;background:#040405}
body{margin:0;min-height:100vh;min-height:100svh;color:#d4d0d0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(ellipse at 50% 30%,#111013 0%,#080809 43%,#030304 85%)}
.wrap{width:min(920px,calc(100% - 48px));min-height:100vh;min-height:100svh;margin:0 auto;padding:clamp(116px,27vh,270px) 0 48px;text-align:center}
.ending-title{display:flex;justify-content:center;align-items:baseline;gap:.25em;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,4.5vw,58px);font-weight:400;line-height:1.25;letter-spacing:.13em;opacity:0;filter:blur(7px);animation:titleIn 3.6s ease .8s forwards}
.ending-number{display:inline-block;width:.72em;text-align:center;letter-spacing:0;font-variant-numeric:lining-nums tabular-nums}
.ending-line{display:flex;align-items:flex-start;justify-content:center;min-height:78px;margin:36px 0 0;color:#999498;font-size:15px;line-height:2.2;letter-spacing:2px;opacity:0;animation:softIn 3s ease 3.2s forwards}
.closing{margin-top:clamp(64px,12vh,126px);opacity:0;animation:softIn 3s ease 4.8s forwards}
.closing::before{content:"";display:block;width:36px;height:1px;margin:0 auto 28px;background:#363236}
.thanks{margin:0 0 28px;color:#777277;font-size:12px;line-height:1.8;letter-spacing:3px}
.contacts{display:flex;justify-content:center;gap:34px}
.contacts img{display:block;width:108px;height:108px;object-fit:contain;background:#0c0c0d;border:1px solid #29262a}
.restart{display:inline-block;margin-top:31px;padding:9px 18px;color:#898389;text-decoration:none;font-size:12px;line-height:1.8;letter-spacing:3px;opacity:0;animation:softIn 2.4s ease 6.2s forwards;transition:color .3s ease}
.restart:hover{color:#cdc5cd}
.restart:focus-visible{outline:1px solid #8c828b;outline-offset:6px}
@keyframes titleIn{to{opacity:1;filter:blur(0)}}
@keyframes softIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.wrap{width:calc(100% - 40px);padding-top:clamp(112px,25svh,200px);padding-bottom:38px}.ending-title{font-size:43px}.ending-line{margin-top:30px;min-height:86px;font-size:13px;letter-spacing:1px;line-height:2.2}.closing{margin-top:68px}.contacts{gap:28px}.contacts img{width:100px;height:100px}}
@media(prefers-reduced-motion:reduce){.ending-title,.ending-line,.closing,.restart{animation:none;opacity:1;filter:none;transform:none}}

/* Clickable author contact images */
.contact-open{display:block;flex:0 0 auto;margin:0;padding:0;border:0;background:transparent;cursor:zoom-in;line-height:0}
.contact-open img{display:block}
.contact-open:focus-visible{outline:2px solid #aaa;outline-offset:6px}
.contact-lightbox{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:68px 24px 28px;border:0;background:rgba(12,12,15,.95);color:#eee;font-family:Arial,sans-serif;overscroll-behavior:contain}
.contact-lightbox::backdrop{background:#0008}
.contact-lightbox[open]{display:flex;align-items:center;justify-content:center}
.contact-full{display:block;width:min(640px,calc(100vw - 48px));height:min(640px,calc(100vh - 100px));height:min(640px,calc(100dvh - 100px));object-fit:contain;filter:none}
.contact-close{position:absolute;top:16px;right:20px;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #ffffff38;border-radius:50%;background:#ffffff0a;color:#eee;font:30px/1 Arial,sans-serif;cursor:pointer}
.contact-close:hover{background:#ffffff20}
.contact-close:focus-visible{outline:2px solid #ddd;outline-offset:4px}

</style>
</head>
<body>
<main class="wrap">
  <section class="ending-intro" aria-labelledby="endingTitle">
    <h1 class="ending-title" id="endingTitle"><span>Ending</span><span class="ending-number">1</span></h1>
    <p class="ending-line" aria-hidden="true"></p>
  </section>
  <footer class="closing">
    <p class="thanks">感谢体验本作品</p>
    <div class="contacts">
      <button class="contact-open" type="button" aria-label="放大查看作者联系方式 1"><img src="./images/contact/contact_1.jpg" alt="作者联系方式 1"></button>
      <button class="contact-open" type="button" aria-label="放大查看作者联系方式 2"><img src="./images/contact/contact_2.jpg" alt="作者联系方式 2"></button>
    </div>
    <a class="restart" href="./5f48c323769e2b7349688e8c.html">重新选择</a>
  </footer>
</main>

<dialog class="contact-lightbox" id="contactLightbox" aria-label="作者联系方式大图">
  <button class="contact-close" id="contactClose" type="button" aria-label="关闭联系方式大图" autofocus>×</button>
  <img class="contact-full" id="contactFullImage" alt="作者联系方式">
</dialog>
<script id="contactLightboxScript">
(()=>{
  const dialog=document.getElementById('contactLightbox');
  const image=document.getElementById('contactFullImage');
  let opener=null,previousOverflow='';
  document.querySelectorAll('.contact-open').forEach(button=>{
    button.addEventListener('click',()=>{
      if(dialog.open)return;
      const thumbnail=button.querySelector('img');
      opener=button;
      previousOverflow=document.body.style.overflow;
      image.src=thumbnail.getAttribute('src');
      image.alt=thumbnail.alt;
      dialog.showModal();
      document.body.style.overflow='hidden';
    });
  });
  document.getElementById('contactClose').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
  dialog.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();dialog.close();}
  });
  dialog.addEventListener('close',()=>{
    document.body.style.overflow=previousOverflow;
    image.removeAttribute('src');
    if(opener)opener.focus({preventScroll:true});
  });
})();
</script>

</body>
</html>
