*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;color:#514d4c;background:#f3f2ec url('./images/endings/ending3_bg.jpg') center top/cover fixed no-repeat;font-family:'STKaiti','KaiTi','Kaiti SC','Ending WenKai',serif;font-weight:400;-webkit-font-smoothing:antialiased}
.veil{min-height:100vh;overflow:hidden;background:linear-gradient(180deg,rgba(255,253,248,.48),rgba(255,253,248,.64) 36%,rgba(255,253,248,.57) 78%,rgba(255,253,248,.83))}
.hero{min-height:78vh;min-height:78svh;display:flex;align-items:center;justify-content:center;padding:90px 24px 76px;text-align:center}
.hero-inner{width:min(1120px,100%);min-width:0}
h1{font-family:'Ending Script',cursive;font-size:clamp(82px,10vw,126px);line-height:1.05;font-weight:400;letter-spacing:1px;margin:0 0 30px;color:#555052;transform:rotate(-4deg);opacity:0;animation:arrive 2.4s ease .2s forwards}
.quote{font-family:'Ending Cursive',cursive;font-size:min(38px,3.1vw);font-weight:400;line-height:1.85;letter-spacing:.025em;white-space:nowrap;color:#62595a;opacity:0;animation:arrive 2.4s ease 1s forwards}

.gallery-wrap{padding:0 24px 80px}
.gallery{position:relative;width:min(1000px,100%);height:1380px;margin:0 auto}
.memory{position:absolute;margin:0;padding:10px 10px 25px;background:#fffcf7;box-shadow:0 3px 5px #3c36360a,0 15px 30px -12px #4e464637;border:1px solid #e6e0d57d;transform:rotate(var(--angle));transition:transform .65s ease,box-shadow .65s ease}
.memory::before{content:'';position:absolute;z-index:1;width:84px;height:25px;top:-12px;left:calc(50% - 42px);background:rgba(231,221,195,.55);border-left:1px dashed #d9d1bd99;border-right:1px dashed #d9d1bd99;transform:rotate(-3deg)}
.memory img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eeeae3}
.memory-1{width:46%;left:2%;top:28px;--angle:-6deg;z-index:2}
.memory-2{width:39%;right:1%;top:174px;--angle:7deg;z-index:3}
.memory-3{width:37%;left:9%;top:475px;--angle:-3deg;z-index:4}
.memory-4{width:45%;right:3%;top:555px;--angle:4deg;z-index:5}
.memory-5{width:44%;left:2%;top:895px;--angle:-5deg;z-index:6}
.memory-6{width:37%;right:5%;top:1040px;--angle:6deg;z-index:7}
.dedication{text-align:center;margin:28px auto 0;font-size:34px;line-height:1.6;letter-spacing:2px;color:#74666b;transform:rotate(-3deg)}
.dedication::after{content:'';display:block;width:115px;height:9px;margin:8px auto 0;border-bottom:1px solid #9a8c8899;border-radius:50%;transform:rotate(-3deg)}
.contact-section{position:relative;padding:58px 24px 66px;text-align:center}
.contact-section::before{content:'';position:absolute;top:0;left:calc(50% - 28px);width:56px;border-top:1px solid #8b7c763f}
.contact-title{font-size:24px;letter-spacing:2px;color:#827572;margin-bottom:25px}
.contacts{display:flex;justify-content:center;gap:26px}
.contacts img{width:116px;height:116px;object-fit:contain;padding:5px;background:rgba(255,255,255,.68);border:1px solid #bbae9e40}
.restart{display:inline-block;margin-top:33px;padding:8px 18px;color:#837873;text-decoration:none;font-size:23px;letter-spacing:2px;text-underline-offset:7px}
.restart:hover{text-decoration:underline;color:#4e4548}
.restart:focus-visible{outline:1px solid #857974;outline-offset:5px;border-radius:2px}
@keyframes arrive{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@media(hover:hover){.memory:hover{transform:translateY(-5px) rotate(calc(var(--angle) * .7));box-shadow:0 18px 35px -10px #4e46463d}}
@media(min-width:701px) and (max-width:1000px){.gallery{height:1250px}.memory-2{top:155px}.memory-3{top:400px}.memory-4{top:485px}.memory-5{top:785px}.memory-6{top:935px}}
@media(max-width:700px){
 body{background-attachment:scroll}
 .hero{min-height:70vh;min-height:70svh;padding:70px 23px 65px}
 h1{font-size:90px;margin-bottom:28px}
 .quote{font-size:3.1vw;letter-spacing:.025em;line-height:1.85}
 .gallery-wrap{padding:8px 24px 62px}

  <div class="viewer-stage" id="viewerStage">
    <button class="viewer-arrow viewer-prev" id="viewerPrev" type="button" aria-label="上一张照片">‹</button>
    <img class="viewer-image" id="viewerImage" alt="">
    <button class="viewer-arrow viewer-next" id="viewerNext" type="button" aria-label="下一张照片">›</button>
  </div>
  <p class="viewer-caption">← / → &nbsp; · &nbsp; ESC</p>
</dialog>
<script>
(()=>{
  const buttons=[...document.querySelectorAll('.photo-open')];
  const viewer=document.getElementById('photoViewer');
  const image=document.getElementById('viewerImage');
  const count=document.getElementById('viewerCount');
  let index=0,previousOverflow='',opener=null;
  function showPhoto(next){
    index=(next+buttons.length)%buttons.length;
    const source=buttons[index].querySelector('img');
    image.src=source.getAttribute('src');
    image.alt=source.alt;
    count.textContent=`${index+1} / ${buttons.length}`;
  }
  function openPhoto(next,button){
    if(viewer.open)return;
    opener=button;
    previousOverflow=document.body.style.overflow;
    showPhoto(next);
    viewer.showModal();
    document.body.style.overflow='hidden';
  }
  buttons.forEach((button,i)=>button.addEventListener('click',()=>openPhoto(i,button)));
  document.getElementById('viewerClose').addEventListener('click',()=>viewer.close());
  document.getElementById('viewerPrev').addEventListener('click',()=>showPhoto(index-1));
  document.getElementById('viewerNext').addEventListener('click',()=>showPhoto(index+1));
  viewer.addEventListener('click',event=>{
    if(event.target===viewer || event.target===document.getElementById('viewerStage'))viewer.close();
  });
  viewer.addEventListener('keydown',event=>{
    if(event.key==='ArrowLeft'){event.preventDefault();showPhoto(index-1);}
    if(event.key==='ArrowRight'){event.preventDefault();showPhoto(index+1);}
    if(event.key==='Escape'){event.preventDefault();viewer.close();}
  });
  viewer.addEventListener('close',()=>{
    document.body.style.overflow=previousOverflow;
    image.removeAttribute('src');
    if(opener)opener.focus({preventScroll:true});
  });
})();
</script>
<dialog class="contact-lightbox" id="contactLightbox" aria-label="作者联系方式大图">
  <button class="contact-close" id="contactClose" type="button" aria-label="关闭联系方式大图" autofocus>×</button>
  <img class="contact-full" id="contactFullImage" alt="作者联系方式">
</dialog>
<script id="contactLightboxScript">
(()=>{
  const dialog=document.getElementById('contactLightbox');
  const image=document.getElementById('contactFullImage');
  let opener=null,previousOverflow='';
  document.querySelectorAll('.contact-open').forEach(button=>{
    button.addEventListener('click',()=>{
      if(dialog.open)return;
      const thumbnail=button.querySelector('img');
      opener=button;
      previousOverflow=document.body.style.overflow;
      image.src=thumbnail.getAttribute('src');
      image.alt=thumbnail.alt;
      dialog.showModal();
      document.body.style.overflow='hidden';
    });
  });
  document.getElementById('contactClose').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
  dialog.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();dialog.close();}
  });
  dialog.addEventListener('close',()=>{
    document.body.style.overflow=previousOverflow;
    image.removeAttribute('src');
    if(opener)opener.focus({preventScroll:true});
  });
})();
</script>


</body>
</html>
