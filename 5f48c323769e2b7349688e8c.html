<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>……</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.018),transparent 36%),#050505}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.flash{position:fixed;inset:0;background:#d9d9d9;opacity:0;pointer-events:none;z-index:5}
.flash.f1{animation:flicker1 1.5s ease}
.line{
  position:absolute;top:44%;font-size:13px;letter-spacing:2px;color:rgba(240,240,240,.82);
  opacity:0;filter:blur(6px);transition:opacity 3s ease,filter 3s ease;
}
.line.show{opacity:1;filter:blur(0)}
.choice{
  position:absolute;top:56%;width:min(520px,86vw);text-align:center;
  opacity:0;transform:translateY(10px);transition:opacity 2.2s ease,transform 2.2s ease;
}
.choice.show{opacity:1;transform:none}
.choice .hint{font-size:15px;letter-spacing:1.5px;color:#d0d0d0;margin-bottom:34px}
.buttons{display:flex;justify-content:center;gap:42px}
button{border:0;background:transparent;color:#999;font-size:14px;letter-spacing:2px;padding:10px 18px;cursor:pointer;transition:.25s}
button:hover{color:#fff;text-shadow:0 0 14px #fff5}
button.pending{color:#666}
@keyframes flicker1{
  0%{opacity:0}
  8%{opacity:.28}
  15%{opacity:.02}
  24%{opacity:.58}
  31%{opacity:.04}
  42%{opacity:.20}
  49%{opacity:0}
  65%{opacity:.38}
  72%{opacity:.01}
  100%{opacity:0}
}
</style>
</head>
<body>
<div class="stage">
  <div class="line" id="line">其实我一直没忘......</div>
  <div class="choice" id="choice">
    <div class="hint">好像还有一些东西没看</div>
    <div class="buttons">
      <button id="giveUp">算了</button>
      <button id="goSee" class="pending">去看看</button>
    </div>
  </div>
</div>
<div class="flash" id="flash"></div>
<script>
const flash=document.getElementById('flash');
const line=document.getElementById('line');
const choice=document.getElementById('choice');

setTimeout(()=>flash.classList.add('f1'),900);
setTimeout(()=>line.classList.add('show'),2500);
setTimeout(()=>choice.classList.add('show'),6500);

document.getElementById('giveUp').onclick=()=>{
  document.body.style.transition='opacity 1.5s ease';
  document.body.style.opacity='0';
  setTimeout(()=>location.href='./73aa6023cf55837fc15a4748.html',1500);
};
document.getElementById('goSee').onclick=()=>{
  document.body.style.transition='opacity 1.5s ease';
  document.body.style.opacity='0';
  setTimeout(()=>location.href='./5c58f0ddef38f094673ff9fd.html',1500);
};
</script>
</body>
</html>
